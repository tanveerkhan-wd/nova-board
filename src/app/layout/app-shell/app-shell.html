<div class="flex h-screen bg-neutral-200 dark:bg-gray-950 overflow-hidden">
  <!-- Sidenav -->
  <aside class="w-64 flex-shrink-0 border-r border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 hidden md:flex flex-col">
    <app-sidenav class="h-full flex flex-col"></app-sidenav>
  </aside>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <!-- Header -->
    <header class="h-16 flex-shrink-0 flex items-center justify-between px-6 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 shadow-sm z-10">
      <div class="flex items-center">
        <button class="md:hidden p-2 rounded-lg text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800 mr-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <span class="text-xl font-black tracking-tight text-jira-blue dark:text-blue-400">NOVA<span class="text-text-dark dark:text-white">BOARD</span></span>
      </div>

      <div class="flex items-center space-x-4">
        <!-- Search Bar Placeholder -->
        <div class="hidden sm:flex items-center bg-neutral-300 dark:bg-gray-800 rounded-lg px-3 py-1.5 w-64">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <input type="text" placeholder="Search..." class="bg-transparent border-none text-sm focus:outline-none w-full text-gray-700 dark:text-gray-300">
        </div>

        <div class="flex items-center space-x-2">
          <button class="p-2 rounded-full text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800 relative">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
            </svg>
            <span class="absolute top-1.5 right-1.5 h-2 w-2 bg-red-500 rounded-full border-2 border-white dark:border-gray-900"></span>
          </button>
          
          <div class="h-8 w-8 rounded-full bg-jira-blue flex items-center justify-center text-white font-bold text-xs cursor-pointer">
            NB
          </div>
          
          <button (click)="logout()" class="text-sm font-medium text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white ml-2">
            Logout
          </button>
        </div>
      </div>
    </header>

    <!-- Content Area -->
    <main class="flex-1 overflow-y-auto min-w-0">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
