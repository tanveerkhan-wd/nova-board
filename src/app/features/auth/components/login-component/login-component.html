<!-- src/app/features/auth/login/login.component.html -->
<div class="auth-container">
  <mat-card class="auth-card" role="region" aria-label="Log in to NovaBoard">
    <div class="card-top">
      <img src="/logo.png" alt="NovaBoard" class="logo" />
      <h1 class="title">Log in to NovaBoard</h1>
      <p class="subtitle">Welcome back — please enter your details.</p>
    </div>

    <mat-card-content>
      <form (ngSubmit)="login()" #loginForm="ngForm" novalidate>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email or username</mat-label>
          <input
            matInput
            [(ngModel)]="email"
            name="email"
            required
            type="email"
            autocomplete="username"
            aria-label="Email or username"
          />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input
            matInput
            [(ngModel)]="password"
            name="password"
            required
            type="password"
            autocomplete="current-password"
            aria-label="Password"
          />
        </mat-form-field>

        <div class="row between help-row">
          <mat-checkbox [(ngModel)]="remember" name="remember">Remember me</mat-checkbox>
          <a class="forgot-link" routerLink="/forgot-password">Forgot password?</a>
        </div>

        <app-button
          type="submit"
          [loading]="loading()"
          [disabled]="!loginForm.form.valid"
          className="w-full"
          size="lg"
        >
          Log in
        </app-button>

        <div *ngIf="error()" class="error-message" role="alert">{{ error() }}</div>
      </form>
    </mat-card-content>

    <mat-card-actions class="card-actions">
      <span>Don’t have an account?</span>
      <a routerLink="/register" class="link">Sign up</a>
    </mat-card-actions>
  </mat-card>
</div>
