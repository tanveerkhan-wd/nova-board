<!-- src/app/features/auth/register/register.component.html -->
<div class="auth-container">
  <mat-card class="auth-card" role="region" aria-label="Create NovaBoard account">
    <div class="card-top">
      <img src="/logo.png" alt="NovaBoard" class="logo" />
      <h1 class="title">Sign up for NovaBoard</h1>
      <p class="subtitle">Create an account to manage projects and tasks.</p>
    </div>

    <mat-card-content>
      <form (ngSubmit)="register()" #regForm="ngForm" novalidate>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Full name</mat-label>
          <input matInput [(ngModel)]="fullName" name="fullName" required autocomplete="name" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput [(ngModel)]="email" name="email" type="email" required autocomplete="email" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput [(ngModel)]="password" name="password" type="password" required autocomplete="new-password" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Confirm password</mat-label>
          <input matInput [(ngModel)]="confirmPassword" name="confirmPassword" type="password" required autocomplete="new-password" />
        </mat-form-field>

        <div *ngIf="error()" class="error-message" role="alert">{{ error() }}</div>

        <app-button
          type="submit"
          [loading]="loading()"
          [disabled]="!regForm.form.valid"
          className="w-full"
          size="lg"
        >
          Create account
        </app-button>
      </form>
    </mat-card-content>

    <mat-card-actions class="card-actions">
      <span>Already have an account?</span>
      <a routerLink="/login" class="link">Sign in</a>
    </mat-card-actions>
  </mat-card>
</div>
