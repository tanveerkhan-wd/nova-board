<div class="p-6 max-w-7xl mx-auto">
  <div class="flex items-center justify-between mb-8">
    <div>
      <h1 class="text-3xl font-bold text-text-dark dark:text-gray-100">Projects</h1>
      <p class="text-text-dark/70 dark:text-gray-400 mt-1">Manage your team's projects and boards.</p>
    </div>
    <app-button icon="add" (btnClick)="openCreateProjectModal()">
      New Project
    </app-button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    @for (project of projects(); track project.id) {
      <div class="bg-white dark:bg-gray-800 rounded-xl border border-neutral-300 dark:border-gray-700 shadow-sm hover:shadow-md transition-shadow p-5 flex flex-col h-full">
        <div class="flex items-start justify-between mb-4">
          <div class="h-10 w-10 rounded-lg bg-jira-blue/10 dark:bg-blue-900/30 flex items-center justify-center text-jira-blue dark:text-blue-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
            </svg>
          </div>
          <div class="flex space-x-1">
            <app-button variant="icon" icon="edit" size="sm"></app-button>
            <app-button variant="icon" icon="delete" size="sm" (btnClick)="deleteProject(project.id)"></app-button>
          </div>
        </div>

        <h3 class="text-lg font-bold text-gray-900 dark:text-gray-100 mb-2 truncate">{{ project.name }}</h3>
        <p class="text-gray-500 dark:text-gray-400 text-sm mb-6 line-clamp-2 flex-grow">
          {{ project.description || 'No description provided.' }}
        </p>

        <div class="pt-4 border-t border-gray-100 dark:border-gray-700 flex items-center justify-between">
          <div class="flex -space-x-2">
            <div class="h-8 w-8 rounded-full bg-neutral-300 dark:bg-gray-700 border-2 border-white dark:border-gray-800 flex items-center justify-center text-[10px] font-bold">JD</div>
            <div class="h-8 w-8 rounded-full bg-jira-blue border-2 border-white dark:border-gray-800 flex items-center justify-center text-[10px] text-white font-bold">AS</div>
          </div>
          <a [routerLink]="['/projects', project.id]" class="text-jira-blue dark:text-blue-400 text-sm font-semibold hover:underline flex items-center">
            Open Board
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
          </a>
        </div>
      </div>
    } @empty {
      <div class="col-span-full py-12 flex flex-col items-center justify-center bg-neutral-100 dark:bg-gray-900/50 rounded-2xl border-2 border-dashed border-neutral-300 dark:border-gray-800">
        <div class="h-16 w-16 bg-neutral-300 dark:bg-gray-800 rounded-full flex items-center justify-center text-text-dark/50 dark:text-gray-500 mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
          </svg>
        </div>
        <h3 class="text-lg font-medium text-gray-900 dark:text-gray-100">No projects found</h3>
        <p class="text-gray-500 dark:text-gray-400 mb-6">Create your first project to get started.</p>
        <app-button icon="add" (btnClick)="openCreateProjectModal()">
          Create Project
        </app-button>
      </div>
    }
  </div>
</div>
