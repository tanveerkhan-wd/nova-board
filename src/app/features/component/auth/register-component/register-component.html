<!-- src/app/features/auth/register/register.component.html -->
<div class="register-container">
  <mat-card class="register-card">
    <mat-card-header>
      <mat-card-title>Create your NovaBoard account</mat-card-title>
      <mat-card-subtitle>Join and start managing projects</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form (ngSubmit)="register()">
        <mat-form-field appearance="outline">
          <mat-label>Full Name</mat-label>
          <input matInput [(ngModel)]="fullName" name="fullName" required />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput [(ngModel)]="email" name="email" type="email" required />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput [(ngModel)]="password" name="password" type="password" required />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Confirm Password</mat-label>
          <input matInput [(ngModel)]="confirmPassword" name="confirmPassword" type="password" required />
        </mat-form-field>

        @if (error()) {
          <div class="error-message">{{ error() }}</div>
        }

        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="loading()"
          class="register-btn"
        >
          @if (loading()) {
            <mat-spinner diameter="20"></mat-spinner>
          } @else {
            Sign Up
          }
        </button>
      </form>
    </mat-card-content>

    <mat-card-actions>
      <button mat-button routerLink="/login">Already have an account? Sign in</button>
    </mat-card-actions>
  </mat-card>
</div>
